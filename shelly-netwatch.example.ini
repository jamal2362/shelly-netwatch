# ---------------------------------------------------------------------------
# shelly-netwatch - Beispielkonfiguration
#
# Kopieren nach  /etc/shelly-netwatch.ini  (oder ~/.config/shelly-netwatch.ini
# bzw. shelly-netwatch.ini neben dem Skript) und die beiden Adressen anpassen.
#
# Diese Datei ist nirgends Pflicht: jeder Wert laesst sich genauso ueber eine
# Umgebungsvariable setzen ([target] url -> TARGET_URL, [shelly] host ->
# SHELLY_HOST, [behaviour] on_exit -> ON_EXIT) - so wird der Docker-Container
# konfiguriert. Reihenfolge: Vorgabe < diese Datei < Umgebung < Kommandozeile.
# ---------------------------------------------------------------------------

[target]
# Was beobachtet wird. Zwei Schreibweisen:
#
#   http://192.168.178.104:8050/api/state   HTTP-Abfrage, der Status zaehlt
#   192.168.178.104:8050                    reiner TCP-Test, nur "Port offen?"
#
# Ohne Schema und ohne Pfad wird ein TCP-Test daraus - das funktioniert bei
# allem, was auf IP und Port antwortet, auch ohne HTTP (SSH, SMB, Drucker,
# Spieleserver). Mit Pfad oder mit http:// wird die Seite wirklich abgefragt.
#
# Beispiel hier: das Webdashboard des Kodi-Add-ons script.lcd4linux.
# /api/state ist dort der guenstigste Endpunkt - ein paar hundert Byte JSON
# statt der ganzen Seite.
url = http://192.168.178.104:8050/api/state

# Sekunden, die eine Abfrage dauern darf.
timeout = 4

# Sekunden zwischen zwei Abfragen.
interval = 10

# So viele erfolgreiche Abfragen hintereinander, bevor eingeschaltet wird.
online_after = 1

# So viele fehlgeschlagene Abfragen hintereinander, bevor ausgeschaltet wird.
# 3 x 10 s = die Steckdose faellt erst nach rund 30 s ab und ueberlebt damit
# einen Neustart des Dienstes oder einen kurzen Netzwerkhaenger.
offline_after = 3

# Nur noetig, wenn der beobachtete Dienst ein Passwort verlangt (HTTP Basic).
# Beim LCD4Linux-Web-Editor ist der Benutzername beliebig, geprueft wird nur
# das Passwort.
username = shelly-netwatch
password =

# HTTP-Status, die als "online" zaehlen. 401 ist dabei, weil ein passwort-
# geschuetzter Dienst antwortet, also laeuft. "any" akzeptiert jede Antwort.
# Beim TCP-Test spielt diese Zeile keine Rolle.
accept_status = 200,401

[shelly]
# Adresse der Shelly (IP oder Hostname), Gen2 oder Gen3 - zum Beispiel eine
# Shelly Plug M Gen3.
host = 192.168.178.60

# Schaltkanal. Eine Steckdose hat genau einen: 0.
channel = 0

# Nur noetig, wenn im Shelly unter "Authentication" ein Passwort gesetzt ist.
# Der Benutzername ist bei Gen2/Gen3 immer "admin".
username = admin
password =

timeout = 5

# So oft wird ein fehlgeschlagener Schaltbefehl wiederholt.
retries = 3

[behaviour]
# Sekunden, nach denen geprueft wird, ob die Steckdose noch so steht, wie sie
# soll - falls jemand sie ueber die App oder den Taster umgelegt hat.
# 0 schaltet diese Nachkorrektur ab (manuelles Schalten bleibt dann bestehen).
resync_interval = 300

# Was beim Beenden des Dienstes mit der Steckdose passiert:
#   keep = so lassen, off = ausschalten, on = einschalten
on_exit = keep

# true = nur protokollieren, nichts wirklich schalten.
dry_run = false
