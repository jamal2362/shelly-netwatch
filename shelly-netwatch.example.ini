# ---------------------------------------------------------------------------
# shelly-netwatch - example configuration
#
# Copy to  /etc/shelly-netwatch.ini  (or ~/.config/shelly-netwatch.ini, or
# shelly-netwatch.ini next to the script) and adjust the two addresses.
#
# This file is nowhere mandatory: every value can just as well be set through
# an environment variable ([target] url -> TARGET_URL, [shelly] host ->
# SHELLY_HOST, [behaviour] on_exit -> ON_EXIT) - that is how the Docker
# container is configured. Order: default < this file < environment < command
# line.
# ---------------------------------------------------------------------------

[target]
# What is watched. Two spellings:
#
#   http://192.168.178.104:8050/api/state   HTTP poll, the status code counts
#   192.168.178.104:8050                    plain TCP test, "is the port open?"
#
# Without a scheme and without a path this becomes a TCP test - which works
# for everything that answers on an IP and a port, HTTP or not (SSH, SMB,
# printers, game servers). With a path, or with http://, the page is really
# fetched. For HTTP, pick the cheapest endpoint the service offers: a few
# hundred bytes of JSON beat a full page every ten seconds.
url = http://192.168.178.104:8050/api/state

# Seconds a single poll may take.
timeout = 4

# Seconds between two polls.
interval = 10

# This many successful polls in a row before switching on.
online_after = 1

# This many failed polls in a row before switching off.
# 3 x 10 s = the socket only drops after about 30 seconds, which lets it ride
# out a service restart or a short network hiccup.
offline_after = 3

# Only needed when the watched service asks for a password (HTTP basic auth).
username = shelly-netwatch
password =

# HTTP status codes that count as "online". 401 is in there because a
# password-protected service is answering, so it is running. "any" accepts
# every answer. This line does not matter for the TCP test.
accept_status = 200,401

[shelly]
# Address of the Shelly (IP or hostname), Gen2 or Gen3 - for example a
# Shelly Plug M Gen3.
host = 192.168.178.60

# Switch channel. A single socket has exactly one: 0.
channel = 0

# Only needed when a password is set on the Shelly under "Authentication".
# On Gen2/Gen3 the username is always "admin".
username = admin
password =

timeout = 5

# How often a failed switch command is retried.
retries = 3

[behaviour]
# Seconds after which the socket is checked against the state it should be in -
# in case somebody flipped it through the app or the button.
# 0 turns this correction off (manual switching then sticks).
resync_interval = 300

# What happens to the socket when the service stops:
#   keep = leave it, off = switch off, on = switch on
on_exit = keep

# true = only log, never actually switch.
dry_run = false
