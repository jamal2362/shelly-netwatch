# shelly-netwatch on a UGREEN NAS (or any other Docker host).
#
#   docker compose up -d --build     # builds the image itself
#   docker compose logs -f
#
# If the image was imported from the GitHub Actions archive instead
# ("docker load -i shelly-netwatch-amd64.tar", or Docker app -> Image ->
# + -> From NAS), it is already called shelly-netwatch:latest and the
# "build: ." line can go.
#
# Only TARGET_URL and SHELLY_HOST need adjusting; everything else has
# sensible defaults and is listed here for reference.

services:
  shelly-netwatch:
    build: .
    image: shelly-netwatch:latest
    container_name: shelly-netwatch
    restart: unless-stopped

    # Bridge networking is enough: the container only makes outgoing
    # connections into the LAN, to the watched service and to the socket.

    environment:
      # -- time zone for the timestamps in the log ------------------------
      TZ: Europe/Berlin

      # -- the watched target ---------------------------------------------
      # With a path or with http:// the page is fetched; a bare HOST:PORT
      # is a plain TCP test ("is anyone answering there at all?").
      TARGET_URL: http://192.168.178.104:8050/api/state
      TARGET_INTERVAL: "10"             # seconds between two polls
      TARGET_TIMEOUT: "4"               # time limit for one poll
      TARGET_ONLINE_AFTER: "1"          # good polls before "on"
      TARGET_OFFLINE_AFTER: "3"         # failed polls before "off" (~30 s)
      TARGET_ACCEPT_STATUS: "200,401"
      # Only when the watched service asks for a password:
      # TARGET_USERNAME: shelly-netwatch
      # TARGET_PASSWORD: s3cret

      # -- the Shelly (Gen2/Gen3, e.g. Plug M Gen3) ------------------------
      SHELLY_HOST: "192.168.178.60"
      SHELLY_CHANNEL: "0"
      SHELLY_TIMEOUT: "5"
      SHELLY_RETRIES: "3"
      # Only when authentication is enabled on the Shelly
      # (the username there is always "admin"):
      # SHELLY_PASSWORD: s3cret
      # ... or from a file, see the block at the bottom:
      # SHELLY_PASSWORD_FILE: /run/secrets/shelly_password

      # -- behaviour -------------------------------------------------------
      RESYNC_INTERVAL: "300"            # correction pass, 0 = off
      ON_EXIT: keep                     # keep | off | on
      DRY_RUN: "false"                  # true = only log
      VERBOSE: "false"                  # true = log every poll
      COMMAND: watch                    # watch | once | status | on | off | test

    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

# Rather not have passwords in clear text in this file? Then write the
# password into a file and uncomment the three places: SHELLY_PASSWORD_FILE
# above, the mapping here in the service, and the source below.
#
#     secrets:
#       - shelly_password        <- belongs in the service, next to "environment"
#
# secrets:
#   shelly_password:
#     file: ./shelly_password.txt
