name: Tests and image

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform (UGREEN DXP2800 = linux/amd64)"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
        default: linux/amd64
      tag:
        description: "Tag the image carries after the import"
        type: string
        default: latest

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test suite
        run: python -m unittest discover -s tests -v

  image:
    # Only runs when the workflow is started by hand: Actions ->
    # "Tests and image" -> "Run workflow".  The result is attached to the
    # run as an artifact and can be imported in the NAS Docker app via
    # Image -> + -> "From NAS".
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine the architecture
        id: arch
        run: echo "name=${PLATFORM##*/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ inputs.platform }}

      # Foreign architectures need emulation, amd64 does not.
      - uses: docker/setup-qemu-action@v3
        if: inputs.platform != 'linux/amd64'

      - uses: docker/setup-buildx-action@v3

      - name: Build the image and write it out as an archive
        uses: docker/build-push-action@v6
        env:
          # Without this, buildx attaches a .dockerbuild log to the run as
          # well; only the image should show up under "Artifacts".
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: ${{ inputs.platform }}
          tags: shelly-netwatch:${{ inputs.tag }}
          outputs: type=docker,dest=/tmp/shelly-netwatch-${{ steps.arch.outputs.name }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show the size
        run: ls -lh /tmp/shelly-netwatch-${{ steps.arch.outputs.name }}.tar

      - name: Attach the archive as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: shelly-netwatch-${{ steps.arch.outputs.name }}
          path: /tmp/shelly-netwatch-${{ steps.arch.outputs.name }}.tar
          retention-days: 30
          if-no-files-found: error
